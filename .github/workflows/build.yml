name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Native Libraries
        working-directory: proxy_core/scripts
        run: |
          chmod +x build_android.sh
          ./build_android.sh

          echo "=== Finding all .so files ==="
          find $GITHUB_WORKSPACE -name "libproxy_core.so" -type f 2>/dev/null || echo "No .so files found"

      - name: Copy Native Libraries to jniLibs
        run: |
          # Create jniLibs directories
          mkdir -p proxy_core/android/src/main/jniLibs/arm64-v8a
          mkdir -p proxy_core/android/src/main/jniLibs/armeabi-v7a
          mkdir -p proxy_core/android/src/main/jniLibs/x86
          mkdir -p proxy_core/android/src/main/jniLibs/x86_64

          echo "=== Finding .so files ==="
          find . -name "libproxy_core.so" -type f

          # Find and copy ARM64 library
          ARM64_SO=$(find . -path "*arm64*libproxy_core.so" -type f | head -1)
          if [ -n "$ARM64_SO" ]; then
            echo "Found ARM64: $ARM64_SO"
            cp "$ARM64_SO" proxy_core/android/src/main/jniLibs/arm64-v8a/
            cp "$ARM64_SO" proxy_core/android/src/main/jniLibs/armeabi-v7a/
          else
            echo "ERROR: ARM64 library not found!"
            exit 1
          fi

          # Find and copy AMD64 library  
          AMD64_SO=$(find . -path "*amd64*libproxy_core.so" -type f | head -1)
          if [ -n "$AMD64_SO" ]; then
            echo "Found AMD64: $AMD64_SO"
            cp "$AMD64_SO" proxy_core/android/src/main/jniLibs/x86_64/
            cp "$AMD64_SO" proxy_core/android/src/main/jniLibs/x86/
          else
            echo "WARNING: AMD64 library not found, using ARM64 for x86"
            cp "$ARM64_SO" proxy_core/android/src/main/jniLibs/x86_64/ || true
            cp "$ARM64_SO" proxy_core/android/src/main/jniLibs/x86/ || true
          fi

          echo "=== jniLibs contents ==="
          find proxy_core/android/src/main/jniLibs -name "*.so"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"

      - name: Get dependencies
        run: |
          flutter pub get
          cd proxy_core && flutter pub get
          cd ../proxy_url_parser && flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk watashi-arm64-v8a.apk || true
          mv app-armeabi-v7a-release.apk watashi-armeabi-v7a.apk || true
          mv app-x86_64-release.apk watashi-x86_64.apk || true
          mv app-release.apk watashi-universal.apk
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watashi-app-apks
          path: build/app/outputs/flutter-apk/watashi-*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/watashi-arm64-v8a.apk
            build/app/outputs/flutter-apk/watashi-armeabi-v7a.apk
            build/app/outputs/flutter-apk/watashi-x86_64.apk
            build/app/outputs/flutter-apk/watashi-universal.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
