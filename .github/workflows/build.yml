name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Native Libraries
        run: |
          cd proxy_core/scripts
          chmod +x build_android.sh
          ./build_android.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"

      - name: Get main dependencies
        run: flutter pub get

      - name: Get proxy_core dependencies
        run: |
          cd proxy_core
          flutter pub get

      - name: Get proxy_url_parser dependencies
        run: |
          cd proxy_url_parser
          flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build Split APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk watashi-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk watashi-armeabi-v7a.apk
          mv app-x86_64-release.apk watashi-x86_64.apk || true
          mv app-release.apk watashi-universal.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watashi-app-apks
          path: |
            build/app/outputs/flutter-apk/watashi-*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/watashi-arm64-v8a.apk
            build/app/outputs/flutter-apk/watashi-armeabi-v7a.apk
            build/app/outputs/flutter-apk/watashi-x86_64.apk
            build/app/outputs/flutter-apk/watashi-universal.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
