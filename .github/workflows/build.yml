name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Native Libraries
        run: |
          cd proxy_core/scripts
          chmod +x build_android.sh
          ./build_android.sh

          echo "=== Build output (from scripts dir) ==="
          ls -la .android_build/
          ls -la .android_build/arm64/
          ls -la .android_build/amd64/

      - name: Copy Native Libraries to jniLibs
        run: |
          # Create jniLibs directories
          mkdir -p proxy_core/android/src/main/jniLibs/arm64-v8a
          mkdir -p proxy_core/android/src/main/jniLibs/armeabi-v7a
          mkdir -p proxy_core/android/src/main/jniLibs/x86
          mkdir -p proxy_core/android/src/main/jniLibs/x86_64

          # Copy from correct path (scripts/.android_build NOT .android_build)
          cp proxy_core/scripts/.android_build/arm64/libproxy_core.so proxy_core/android/src/main/jniLibs/arm64-v8a/
          cp proxy_core/scripts/.android_build/arm64/libproxy_core.so proxy_core/android/src/main/jniLibs/armeabi-v7a/
          cp proxy_core/scripts/.android_build/amd64/libproxy_core.so proxy_core/android/src/main/jniLibs/x86_64/
          cp proxy_core/scripts/.android_build/amd64/libproxy_core.so proxy_core/android/src/main/jniLibs/x86/

          echo "=== jniLibs contents ==="
          find proxy_core/android/src/main/jniLibs -name "*.so"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"

      - name: Get dependencies
        run: |
          flutter pub get
          cd proxy_core && flutter pub get
          cd ../proxy_url_parser && flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk watashi-arm64-v8a.apk || true
          mv app-armeabi-v7a-release.apk watashi-armeabi-v7a.apk || true
          mv app-x86_64-release.apk watashi-x86_64.apk || true
          mv app-release.apk watashi-universal.apk
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watashi-app-apks
          path: build/app/outputs/flutter-apk/watashi-*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/watashi-arm64-v8a.apk
            build/app/outputs/flutter-apk/watashi-armeabi-v7a.apk
            build/app/outputs/flutter-apk/watashi-x86_64.apk
            build/app/outputs/flutter-apk/watashi-universal.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
