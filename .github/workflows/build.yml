name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.11902837"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Native Libraries
        run: |
          cd proxy_core/scripts
          chmod +x build_android.sh
          ./build_android.sh || true

          echo "=== Listing build output ==="
          ls -la .android_build/ || echo "No .android_build directory"
          ls -la .android_build/arm64/ || echo "No arm64 directory"
          ls -la .android_build/amd64/ || echo "No amd64 directory"

      - name: Copy Native Libraries to jniLibs
        run: |
          # Create jniLibs directories
          mkdir -p proxy_core/android/src/main/jniLibs/arm64-v8a
          mkdir -p proxy_core/android/src/main/jniLibs/armeabi-v7a
          mkdir -p proxy_core/android/src/main/jniLibs/x86
          mkdir -p proxy_core/android/src/main/jniLibs/x86_64

          # Check what was built
          echo "=== Checking build outputs ==="
          find proxy_core/scripts/.android_build -name "*.so" 2>/dev/null || echo "No .so files found"

          # Copy ARM64 library if exists
          if [ -f "proxy_core/scripts/.android_build/arm64/libproxy_core.so" ]; then
            cp proxy_core/scripts/.android_build/arm64/libproxy_core.so proxy_core/android/src/main/jniLibs/arm64-v8a/
            echo "Copied ARM64 to arm64-v8a"
          fi

          # Copy AMD64 library for x86_64
          if [ -f "proxy_core/scripts/.android_build/amd64/libproxy_core.so" ]; then
            cp proxy_core/scripts/.android_build/amd64/libproxy_core.so proxy_core/android/src/main/jniLibs/x86_64/
            echo "Copied AMD64 to x86_64"
          fi

          # For armeabi-v7a, use ARM64 as fallback (or skip if not available)
          if [ -f "proxy_core/android/src/main/jniLibs/arm64-v8a/libproxy_core.so" ]; then
            cp proxy_core/android/src/main/jniLibs/arm64-v8a/libproxy_core.so proxy_core/android/src/main/jniLibs/armeabi-v7a/
            echo "Copied to armeabi-v7a from arm64"
          fi

          # For x86, use amd64 as fallback
          if [ -f "proxy_core/android/src/main/jniLibs/x86_64/libproxy_core.so" ]; then
            cp proxy_core/android/src/main/jniLibs/x86_64/libproxy_core.so proxy_core/android/src/main/jniLibs/x86/
            echo "Copied to x86 from x86_64"
          fi

          echo "=== Final jniLibs contents ==="
          find proxy_core/android/src/main/jniLibs -name "*.so" 2>/dev/null || echo "No .so files in jniLibs"

          # Fail if no libraries were copied
          if [ ! -f "proxy_core/android/src/main/jniLibs/arm64-v8a/libproxy_core.so" ] && [ ! -f "proxy_core/android/src/main/jniLibs/x86_64/libproxy_core.so" ]; then
            echo "ERROR: No native libraries were successfully built!"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"

      - name: Get main dependencies
        run: flutter pub get

      - name: Get proxy_core dependencies
        run: |
          cd proxy_core
          flutter pub get

      - name: Get proxy_url_parser dependencies
        run: |
          cd proxy_url_parser
          flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build Split APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk watashi-arm64-v8a.apk || true
          mv app-armeabi-v7a-release.apk watashi-armeabi-v7a.apk || true
          mv app-x86_64-release.apk watashi-x86_64.apk || true
          mv app-release.apk watashi-universal.apk
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watashi-app-apks
          path: |
            build/app/outputs/flutter-apk/watashi-*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/watashi-arm64-v8a.apk
            build/app/outputs/flutter-apk/watashi-armeabi-v7a.apk
            build/app/outputs/flutter-apk/watashi-x86_64.apk
            build/app/outputs/flutter-apk/watashi-universal.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
