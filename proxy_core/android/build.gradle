import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.mahsanet.proxy_core"
version = "1.0"

buildscript {
    ext {
        kotlin_version = '2.0.21'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // For local AAR files (libbox.aar for SingBox)
        // rootProject.projectDir is android/ folder, so go up one level to main project
        flatDir {
            dirs "${rootProject.projectDir}/../proxy_core/android/libs"
        }
    }
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
dependencies {
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.appcompat:appcompat-resources:1.7.0")
    implementation('androidx.activity:activity-ktx:1.9.3')
    implementation('androidx.fragment:fragment-ktx:1.8.5')
    // SingBox libbox
    implementation(name: 'libbox', ext: 'aar')
}
android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.mahsanet.proxy_core"
    }

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 34

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = "27.0.11902837"

    // NOTE: Native libraries (.so files) are prebuilt during CI/CD workflow.
    // They are copied to src/main/jniLibs/ before the APK build.
    // To build manually, run: cd proxy_core/scripts && ./build_android.sh

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
    }
}
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        languageVersion = "1.9"
    }
}
